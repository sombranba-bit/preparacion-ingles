<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Perfil · B · Cabina</title><link rel="stylesheet" href="base.css">
<style>
.hero{display:grid;grid-template-columns:auto 1fr auto;gap:28px;align-items:center;padding:26px}
.hero h2{margin:0;font-size:26px}
.hero p{margin:4px 0 12px;color:var(--muted);font-weight:600}
.hero .av{margin:0;width:128px;height:128px;font-size:64px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}
.strip{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 12px;scroll-snap-type:x mandatory}
.strip .avs{display:flex;grid-template-columns:none}
.strip .avs div{min-width:132px;scroll-snap-align:start}
.sec{margin:30px 0 12px;font-size:15px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--text);padding-left:12px;border-left:5px solid var(--accent)}
@media (max-width:820px){.hero{grid-template-columns:1fr;text-align:center}.hero .av{margin:0 auto}.pair{grid-template-columns:1fr}.hero .sw{justify-content:center}}
</style></head><body><div class="wrap">
<section class="card hero">
  <div class="av">🐻</div>
  <div><h2>Tu nombre</h2><p>Examen A1 · objetivo oficial</p>
    <div class="chips"><button class="chip">10 monedas · Ir a la tienda</button><button class="chip">2 días de racha</button><button class="chip">1 de 6 logros</button></div></div>
  <div><span class="etiq">Color de fondo</span><div class="sw"><i class="on" style="background:#ffd9a0"></i><i style="background:#c8f2dd"></i><i style="background:#e6dcff"></i><i style="background:#cdeeff"></i></div></div>
</section>
<div class="sec">Personaje</div>
<div class="strip"><div class="avs">
  <div class="on">🐻<small>Pepa</small></div><div>🦊<small>Lucas</small></div><div>🌞<small>Erika</small></div>
  <div class="lock">🐱<small>Mía · 300</small></div><div class="lock">🐧<small>Tito · 400</small></div><div class="lock">🐰<small>Nube · 500</small></div><div class="lock">🐷<small>Lola · 550</small></div>
</div></div>
<div class="sec">Idiomas, modo y datos</div>
<div class="pair">
  <div class="card"><span class="etiq">Explicaciones</span><div class="seg"><button aria-pressed="true">Español</button><button aria-pressed="false">English</button></div>
    <span class="etiq" style="margin-top:14px">Ejercicios</span><div class="seg"><button aria-pressed="true">Inglés</button><button aria-pressed="false">Español</button></div></div>
  <div class="card"><span class="etiq">Modo y monedas</span>
    <div class="chips"><button class="chip">🌙 Modo oscuro</button><button class="chip">Mostrar +1 al acertar: sí</button></div>
    <div style="margin-top:18px"><span class="etiq">Cuenta</span><div class="chips"><button class="chip">Cerrar sesión</button><button class="chip">Importar y copia</button></div></div></div>
</div>
<div class="danger-box" style="margin-top:22px"><strong>Zona peligrosa</strong><div class="chips"><button class="chip danger">Borrar mi cuenta</button><button class="chip danger">Borrar todos los datos</button></div></div>
</div></body></html>
